<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="__THEME_BAR__" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="__THEME_DARK__" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var t = localStorage.getItem('aiu-theme');
        var dark = t === 'dark' || ((t !== 'light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <script>
      // iOS Safari увеличивает страницу при фокусе поля и не возвращает масштаб назад, даже при шрифте 16px
      // (например, в textarea внутри нижнего листа над клавиатурой). Начиная с iOS 10 maximum-scale=1
      // отключает только этот автозум, а pinch-zoom пользователя Safari всё равно разрешает.
      // На Android и десктопе maximum-scale запрещает pinch-zoom, поэтому meta меняем только на iOS/iPadOS.
      (function () {
        var ua = navigator.userAgent || '';
        var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (!ios) return;
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta && !/maximum-scale/.test(meta.content)) meta.content += ', maximum-scale=1';
      })();
    </script>
    <script>
      // Загрузочная заглушка: бандл (и его i18n) здесь недоступен, поэтому строки лежат прямо в скрипте
      // (осознанное исключение из правила «без текста в коде»).
      (function () {
        var KEY = 'aiu-chunk-reload-at';
        var TEXT = {
          ru: ['Не удалось загрузить страницу', 'Проверьте подключение к интернету', 'Обновить'],
          kk: ['Бетті жүктеу мүмкін болмады', 'Интернет байланысын тексеріңіз', 'Жаңарту'],
          en: ["Couldn't load the page", 'Check your internet connection', 'Refresh'],
        };
        var timer;
        function show() {
          if (window.__aiuBooted) return;
          var el = document.getElementById('aiu-boot-fallback');
          if (!el) return;
          var lang = ((navigator.language || 'ru').split('-')[0] || 'ru').toLowerCase();
          var t = TEXT[lang] || TEXT.ru;
          document.getElementById('aiu-bf-title').textContent = t[0];
          document.getElementById('aiu-bf-hint').textContent = t[1];
          var btn = document.getElementById('aiu-bf-btn');
          btn.textContent = t[2];
          btn.onclick = function () { location.reload(); };
          el.hidden = false;
        }
        function reloadOnce() {
          var last = 0;
          try { last = Number(sessionStorage.getItem(KEY)) || 0; } catch (e) {}
          if (Date.now() - last < 10000) return false;
          try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) { return false; }
          location.reload();
          return true;
        }
        window.addEventListener('error', function (e) {
          var n = e.target;
          if (!n || (n.tagName !== 'SCRIPT' && n.tagName !== 'LINK')) return;
          var url = n.src || n.href || '';
          if (url.indexOf('/assets/') === -1 || window.__aiuBooted) return;
          if (!reloadOnce()) show();
        }, true);
        timer = setTimeout(show, 12000);
        window.__aiuBootDone = function () {
          window.__aiuBooted = true;
          clearTimeout(timer);
          var el = document.getElementById('aiu-boot-fallback');
          if (el) el.remove();
        };
      })();
    </script>
    <title>AIU Chat</title>
    <meta name="description" content="Чат студентов Международного университета Астаны" />
    <meta property="og:title" content="AIU Chat" />
    <meta property="og:description" content="Чат студентов Международного университета Астаны" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://aiuchatmain-web.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <div id="aiu-boot-fallback" hidden>
      <div class="aiu-bf-card">
        <h1 id="aiu-bf-title"></h1>
        <p id="aiu-bf-hint"></p>
        <button id="aiu-bf-btn" type="button"></button>
      </div>
    </div>
    <style>
      #aiu-boot-fallback { position: fixed; inset: 0; z-index: 2147483647; display: flex; align-items: center; justify-content: center; padding: 16px; background: __THEME_PAGE__; color: #1c1b22; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #aiu-boot-fallback[hidden] { display: none; }
      .aiu-bf-card { width: 100%; max-width: 400px; padding: 24px; border-radius: 24px; background: #fff; box-shadow: 0 8px 32px rgba(57, 48, 133, 0.12); }
      .aiu-bf-card h1 { margin: 0 0 12px; font-size: 24px; font-weight: 700; }
      .aiu-bf-card p { margin: 0 0 20px; font-size: 14px; opacity: 0.7; }
      .aiu-bf-card button { width: 100%; height: 44px; border: 0; border-radius: 10px; background: __THEME_BAR__; color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
      @media (prefers-color-scheme: dark) {
        #aiu-boot-fallback { background: __THEME_DARK__; color: #f2f2f5; }
        .aiu-bf-card { background: #181f2c; box-shadow: none; }
        .aiu-bf-card button { background: #8c82e6; color: __THEME_DARK__; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
